name: ScheduleCatcher Android

on:
  push:
    paths:
      - "ScheduleCatcher/**"
      - ".github/workflows/schedulecatcher-android.yml"
  pull_request:
    paths:
      - "ScheduleCatcher/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ScheduleCatcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (parser / iCalendar / CalDAV)
        run: ./gradlew :core:test --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleCatcher-debug-apk
          path: ScheduleCatcher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: ScheduleCatcher/core/build/reports/tests/test
