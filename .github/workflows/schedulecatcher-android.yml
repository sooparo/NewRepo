name: ScheduleCatcher Android

on:
  push:
    branches-ignore:
      - apk
    paths:
      - "ScheduleCatcher/**"
      - ".github/workflows/schedulecatcher-android.yml"
  pull_request:
    paths:
      - "ScheduleCatcher/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ScheduleCatcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (parser / iCalendar / CalDAV)
        run: ./gradlew :core:test --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleCatcher-debug-apk
          path: ScheduleCatcher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: ScheduleCatcher/core/build/reports/tests/test

      # 최신 APK 를 'apk' 브랜치에 올린다 (항상 최신 1개만 유지, 강제 덮어쓰기)
      - name: Publish APK to apk branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          out="$RUNNER_TEMP/apk-branch"
          mkdir -p "$out"
          cp app/build/outputs/apk/debug/app-debug.apk "$out/ScheduleCatcher.apk"
          printf '# ScheduleCatcher APK\n\n- source commit: %s\n- source branch: %s\n- built: %s\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$out/README.md"
          cd "$out"
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ScheduleCatcher.apk README.md
          git commit -q -m "APK build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
