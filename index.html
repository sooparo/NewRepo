<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>우리집 식단</title>
  <meta name="description" content="아침·저녁 주간 식단 추천과 쿠팡 장보기 목록">
  <meta name="theme-color" content="#fff8f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1814" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="우리집 식단">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="view" id="view"></main>
  <nav class="tabbar" id="tabbar" aria-label="메뉴">
    <button data-action="tab" data-tab="plan"><span class="ti">📅</span><span>식단</span></button>
    <button data-action="tab" data-tab="shop"><span class="ti">🛒</span><span>장보기</span></button>
    <button data-action="tab" data-tab="recipes"><span class="ti">📖</span><span>레시피</span></button>
    <button data-action="tab" data-tab="settings"><span class="ti">⚙️</span><span>설정</span></button>
  </nav>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>이 앱은 자바스크립트가 필요해요.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
